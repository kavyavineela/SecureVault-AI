name: flutter_app
description: SecureVault AI - Cyber Security Flutter Application
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Path Provider
  path_provider: ^2.1.5

  # Password Strength Checker
  password_strength_checker: ^1.2.0

  # UUID Generator
  uuid: ^4.5.1

  # AES Encryption
  encrypt: ^5.0.3

  # Biometric Authentication
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Hive Code Generator
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/